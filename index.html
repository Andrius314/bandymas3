<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Forge | AI Prompt Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7ef;
      --surface: #ffffff;
      --surface-soft: #f0f2e6;
      --surface-strong: #e7edd0;
      --text: #163029;
      --text-soft: #46635a;
      --accent: #1b8774;
      --accent-strong: #156558;
      --alt: #e69531;
      --danger: #bf3a3a;
      --border: #c8d4c6;
      --shadow: 0 18px 36px rgba(22, 48, 41, 0.12);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f5f7ef 0%, #edf7ef 40%, #f9f2df 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: -1;
      opacity: 0.32;
    }

    body::before {
      top: -120px;
      right: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, #c6f0df 0%, rgba(198, 240, 223, 0) 72%);
    }

    body::after {
      left: -120px;
      bottom: -120px;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe2b6 0%, rgba(255, 226, 182, 0) 72%);
    }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 36px;
      animation: intro 0.7s ease;
    }

    @keyframes intro {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .headline {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      letter-spacing: -0.03em;
    }

    .subline {
      margin: 6px 0 0;
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 36%) minmax(0, 1fr);
      gap: 14px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #fcfef8 0%, #f7faef 100%);
    }

    .panel-title {
      margin: 0;
      font-size: 1.06rem;
    }

    .panel-body {
      padding: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-soft);
      font-size: 0.83rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea {
      min-height: 210px;
      resize: vertical;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(27, 135, 116, 0.16);
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .field {
      margin-bottom: 12px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    button:hover {
      filter: brightness(0.97);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: var(--surface-soft);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-alt {
      background: #fff4e3;
      border-color: #f0d1a6;
      color: #794500;
    }

    .btn-danger {
      background: #ffecec;
      border-color: #efc6c6;
      color: var(--danger);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .chip {
      border: 1px solid #cde5da;
      border-radius: 999px;
      background: #f4fcf7;
      color: #206154;
      font-size: 0.82rem;
      padding: 4px 10px;
      cursor: pointer;
    }

    .chip.active {
      background: #d8f3e9;
      border-color: #8fd3bc;
      font-weight: 700;
    }

    .prompt-list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 300px);
      overflow: auto;
      padding-right: 4px;
    }

    .prompt-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px;
      cursor: pointer;
      background: #fff;
      animation: rise 0.28s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .prompt-card.active {
      border-color: #82c7b2;
      background: #f4fdf9;
      box-shadow: 0 8px 18px rgba(27, 135, 116, 0.1);
    }

    .prompt-card h3 {
      margin: 0 0 4px;
      font-size: 0.98rem;
    }

    .meta {
      font-size: 0.79rem;
      color: var(--text-soft);
      margin-bottom: 5px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      margin: 0 4px 4px 0;
      background: #ebf5ef;
      border: 1px solid #d4e6da;
      border-radius: 999px;
      font-size: 0.73rem;
      padding: 2px 8px;
      color: #2d564a;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      color: #215447;
      font-size: 0.89rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }

    .version-list {
      margin-top: 8px;
      max-height: 200px;
      overflow: auto;
      display: grid;
      gap: 7px;
    }

    .version-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px;
      background: #f9fcf6;
    }

    .version-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-soft);
    }

    .tiny {
      font-size: 0.8rem;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--text-soft);
      background: #fbfdf8;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .prompt-list {
        max-height: 340px;
      }
    }

    @media (max-width: 620px) {
      .app-shell {
        padding: 18px 12px 26px;
      }

      .toolbar,
      .filter-bar {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1 class="headline">Prompt Forge</h1>
        <p class="subline">Save, version, filter, and reuse high performing prompts.</p>
      </div>
      <div class="quick-actions">
        <button id="newPromptBtn" class="btn-primary">New Prompt</button>
        <button id="exportBtn" class="btn-secondary">Export JSON</button>
        <button id="importBtn" class="btn-secondary">Import JSON</button>
        <input id="importInput" class="hidden" type="file" accept="application/json">
      </div>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Vault</h2>
        </div>
        <div class="panel-body">
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="Search title, tag, or text...">
            <select id="sortSelect">
              <option value="updated">Sort: Recent</option>
              <option value="title">Sort: Title</option>
              <option value="used">Sort: Most Used</option>
              <option value="favorite">Sort: Favorite First</option>
            </select>
          </div>
          <div class="filter-bar">
            <select id="toneFilter">
              <option value="all">All Tones</option>
              <option value="professional">Professional</option>
              <option value="friendly">Friendly</option>
              <option value="direct">Direct</option>
              <option value="creative">Creative</option>
            </select>
            <select id="typeFilter">
              <option value="all">All Types</option>
              <option value="marketing">Marketing</option>
              <option value="coding">Coding</option>
              <option value="sales">Sales</option>
              <option value="support">Support</option>
              <option value="research">Research</option>
            </select>
          </div>
          <div id="tagCloud" class="tag-cloud"></div>
          <div id="promptList" class="prompt-list"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Editor</h2>
        </div>
        <div class="panel-body">
          <form id="promptForm">
            <div class="field">
              <label for="titleInput">Prompt Title</label>
              <input id="titleInput" required maxlength="90" placeholder="Example: SEO Blog Outline Builder">
            </div>
            <div class="row">
              <div class="field" style="flex:1; min-width:160px;">
                <label for="toneSelect">Tone</label>
                <select id="toneSelect" required>
                  <option value="professional">Professional</option>
                  <option value="friendly">Friendly</option>
                  <option value="direct">Direct</option>
                  <option value="creative">Creative</option>
                </select>
              </div>
              <div class="field" style="flex:1; min-width:160px;">
                <label for="typeSelect">Type</label>
                <select id="typeSelect" required>
                  <option value="marketing">Marketing</option>
                  <option value="coding">Coding</option>
                  <option value="sales">Sales</option>
                  <option value="support">Support</option>
                  <option value="research">Research</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="tagsInput">Tags (comma separated)</label>
              <input id="tagsInput" placeholder="seo, content, startup">
            </div>
            <div class="field">
              <label for="noteInput">Change Note</label>
              <input id="noteInput" maxlength="120" placeholder="What changed in this version?">
            </div>
            <div class="field">
              <label for="contentInput">Prompt Body</label>
              <textarea id="contentInput" required placeholder="Write your prompt template here..."></textarea>
            </div>

            <div class="row">
              <button type="submit" class="btn-primary">Save Prompt</button>
              <button id="copyBtn" type="button" class="btn-alt">Copy Prompt</button>
              <button id="duplicateBtn" type="button" class="btn-secondary">Duplicate</button>
              <button id="favoriteBtn" type="button" class="btn-secondary">Toggle Favorite</button>
              <button id="deleteBtn" type="button" class="btn-danger">Delete</button>
            </div>
          </form>

          <p id="status" class="status"></p>

          <section>
            <h3 class="panel-title tiny">Version History</h3>
            <div id="versionList" class="version-list"></div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "prompt_forge_v1";
    const ui = {
      list: document.getElementById("promptList"),
      form: document.getElementById("promptForm"),
      status: document.getElementById("status"),
      search: document.getElementById("searchInput"),
      sort: document.getElementById("sortSelect"),
      toneFilter: document.getElementById("toneFilter"),
      typeFilter: document.getElementById("typeFilter"),
      tagCloud: document.getElementById("tagCloud"),
      versionList: document.getElementById("versionList"),
      importInput: document.getElementById("importInput"),
      titleInput: document.getElementById("titleInput"),
      toneSelect: document.getElementById("toneSelect"),
      typeSelect: document.getElementById("typeSelect"),
      tagsInput: document.getElementById("tagsInput"),
      noteInput: document.getElementById("noteInput"),
      contentInput: document.getElementById("contentInput"),
      newPromptBtn: document.getElementById("newPromptBtn"),
      exportBtn: document.getElementById("exportBtn"),
      importBtn: document.getElementById("importBtn"),
      copyBtn: document.getElementById("copyBtn"),
      duplicateBtn: document.getElementById("duplicateBtn"),
      favoriteBtn: document.getElementById("favoriteBtn"),
      deleteBtn: document.getElementById("deleteBtn")
    };

    let prompts = [];
    let activePromptId = null;
    let activeTag = "all";

    const starterPrompts = [
      {
        id: uid(),
        title: "High Intent Landing Page Critic",
        tone: "direct",
        type: "marketing",
        tags: ["conversion", "cro", "landing-page"],
        content: "You are a senior CRO strategist. Review the landing page text below and return: 1) Biggest friction points, 2) Better headline options, 3) CTA rewrites, 4) Trust element improvements. Keep output concise and ranked by impact.\n\nLanding page copy:\n{{paste_copy_here}}",
        favorite: true,
        useCount: 4,
        createdAt: nowIso(),
        updatedAt: nowIso(),
        versions: []
      },
      {
        id: uid(),
        title: "Feature Spec to Code Plan",
        tone: "professional",
        type: "coding",
        tags: ["architecture", "typescript", "frontend"],
        content: "Act as a principal engineer. Convert this feature request into:\n- clear acceptance criteria\n- API contract proposal\n- frontend data flow\n- rollout plan with risks\n\nFeature request:\n{{feature_text}}",
        favorite: false,
        useCount: 2,
        createdAt: nowIso(),
        updatedAt: nowIso(),
        versions: []
      },
      {
        id: uid(),
        title: "Customer Objection Neutralizer",
        tone: "friendly",
        type: "sales",
        tags: ["b2b", "outbound", "objections"],
        content: "You are a B2B sales coach. Rewrite the following response to handle objections without sounding pushy. Use empathy, one proof point, and one soft next step.\n\nProspect message:\n{{prospect_message}}",
        favorite: false,
        useCount: 6,
        createdAt: nowIso(),
        updatedAt: nowIso(),
        versions: []
      }
    ];

    init();

    function init() {
      prompts = loadPrompts();
      if (!prompts.length) {
        prompts = starterPrompts;
        savePrompts();
      }

      activePromptId = prompts[0] ? prompts[0].id : null;
      bindEvents();
      render();
      fillFormFromActive();
      setStatus("Vault ready.");
    }

    function bindEvents() {
      ui.form.addEventListener("submit", onSavePrompt);
      ui.search.addEventListener("input", render);
      ui.sort.addEventListener("change", render);
      ui.toneFilter.addEventListener("change", render);
      ui.typeFilter.addEventListener("change", render);
      ui.newPromptBtn.addEventListener("click", onCreateNew);
      ui.copyBtn.addEventListener("click", onCopyPrompt);
      ui.duplicateBtn.addEventListener("click", onDuplicatePrompt);
      ui.favoriteBtn.addEventListener("click", onToggleFavorite);
      ui.deleteBtn.addEventListener("click", onDeletePrompt);
      ui.exportBtn.addEventListener("click", onExportJson);
      ui.importBtn.addEventListener("click", () => ui.importInput.click());
      ui.importInput.addEventListener("change", onImportJson);
    }

    function loadPrompts() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.map(normalizePrompt).filter(Boolean);
      } catch (error) {
        console.error(error);
        return [];
      }
    }

    function savePrompts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
    }

    function normalizePrompt(item) {
      if (!item || typeof item !== "object") return null;
      if (!item.id || !item.title || !item.content) return null;
      return {
        id: String(item.id),
        title: String(item.title),
        tone: safePick(item.tone, ["professional", "friendly", "direct", "creative"], "professional"),
        type: safePick(item.type, ["marketing", "coding", "sales", "support", "research"], "marketing"),
        tags: Array.isArray(item.tags) ? item.tags.map((tag) => String(tag).trim()).filter(Boolean) : [],
        content: String(item.content),
        favorite: Boolean(item.favorite),
        useCount: Number.isFinite(item.useCount) ? item.useCount : 0,
        createdAt: item.createdAt || nowIso(),
        updatedAt: item.updatedAt || nowIso(),
        versions: Array.isArray(item.versions) ? item.versions.slice(0, 40) : []
      };
    }

    function safePick(value, allowed, fallback) {
      return allowed.includes(value) ? value : fallback;
    }

    function render() {
      renderTagCloud();
      renderPromptList();
      renderVersions();
    }

    function renderTagCloud() {
      const tags = new Set();
      prompts.forEach((prompt) => prompt.tags.forEach((tag) => tags.add(tag.toLowerCase())));
      const sorted = ["all"].concat(Array.from(tags).sort((a, b) => a.localeCompare(b)));
      ui.tagCloud.innerHTML = "";

      sorted.forEach((tag) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (activeTag === tag ? " active" : "");
        chip.textContent = tag;
        chip.addEventListener("click", () => {
          activeTag = tag;
          render();
        });
        ui.tagCloud.appendChild(chip);
      });
    }

    function renderPromptList() {
      const visible = getFilteredPrompts();
      ui.list.innerHTML = "";

      if (!visible.length) {
        ui.list.innerHTML = '<div class="empty">No prompts match your filters.</div>';
        return;
      }

      visible.forEach((prompt, index) => {
        const card = document.createElement("article");
        card.className = "prompt-card" + (prompt.id === activePromptId ? " active" : "");
        card.style.animationDelay = Math.min(index * 30, 280) + "ms";
        card.innerHTML = `
          <h3>${escapeHtml(prompt.title)}</h3>
          <div class="meta">${prompt.type} | ${prompt.tone} | used ${prompt.useCount}x ${prompt.favorite ? "| favorite" : ""}</div>
          <div>${prompt.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        `;
        card.addEventListener("click", () => {
          activePromptId = prompt.id;
          fillFormFromActive();
          render();
        });
        ui.list.appendChild(card);
      });
    }

    function renderVersions() {
      const active = findActive();
      ui.versionList.innerHTML = "";

      if (!active) {
        ui.versionList.innerHTML = '<div class="empty">Create or select a prompt to see versions.</div>';
        return;
      }

      if (!active.versions.length) {
        ui.versionList.innerHTML = '<div class="empty">No saved versions yet. Save changes to build history.</div>';
        return;
      }

      const byLatest = active.versions.slice().reverse();
      byLatest.forEach((version) => {
        const el = document.createElement("div");
        el.className = "version-item";
        el.innerHTML = `
          <div class="version-row">
            <strong>${escapeHtml(version.note || "Revision")}</strong>
            <span>${formatDate(version.createdAt)}</span>
          </div>
          <div class="row" style="margin-top:8px;">
            <button class="btn-secondary tiny" type="button" data-copy="${version.id}">Copy</button>
            <button class="btn-secondary tiny" type="button" data-restore="${version.id}">Restore to editor</button>
          </div>
        `;
        ui.versionList.appendChild(el);
      });

      ui.versionList.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const version = active.versions.find((v) => v.id === btn.dataset.copy);
          if (!version) return;
          navigator.clipboard.writeText(version.content).then(() => {
            setStatus("Version copied to clipboard.");
          });
        });
      });

      ui.versionList.querySelectorAll("[data-restore]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const version = active.versions.find((v) => v.id === btn.dataset.restore);
          if (!version) return;
          ui.contentInput.value = version.content;
          ui.noteInput.value = "Restored from history";
          setStatus("Version restored to editor. Save to keep it.");
        });
      });
    }

    function getFilteredPrompts() {
      const search = ui.search.value.trim().toLowerCase();
      const tone = ui.toneFilter.value;
      const type = ui.typeFilter.value;
      const sort = ui.sort.value;

      let output = prompts.filter((prompt) => {
        const haystack = [prompt.title, prompt.content, prompt.tags.join(" "), prompt.tone, prompt.type].join(" ").toLowerCase();
        const searchMatch = search ? haystack.includes(search) : true;
        const toneMatch = tone === "all" ? true : prompt.tone === tone;
        const typeMatch = type === "all" ? true : prompt.type === type;
        const tagMatch = activeTag === "all" ? true : prompt.tags.map((tag) => tag.toLowerCase()).includes(activeTag);
        return searchMatch && toneMatch && typeMatch && tagMatch;
      });

      output.sort((a, b) => {
        if (sort === "title") return a.title.localeCompare(b.title);
        if (sort === "used") return b.useCount - a.useCount;
        if (sort === "favorite") {
          if (a.favorite === b.favorite) return dateMs(b.updatedAt) - dateMs(a.updatedAt);
          return a.favorite ? -1 : 1;
        }
        return dateMs(b.updatedAt) - dateMs(a.updatedAt);
      });

      return output;
    }

    function onSavePrompt(event) {
      event.preventDefault();
      const payload = getFormPayload();
      if (!payload.title || !payload.content) {
        setStatus("Title and body are required.");
        return;
      }

      const active = findActive();
      if (!active) {
        const next = {
          id: uid(),
          title: payload.title,
          tone: payload.tone,
          type: payload.type,
          tags: payload.tags,
          content: payload.content,
          favorite: false,
          useCount: 0,
          createdAt: nowIso(),
          updatedAt: nowIso(),
          versions: []
        };
        prompts.unshift(next);
        activePromptId = next.id;
        savePrompts();
        render();
        fillFormFromActive();
        setStatus("Prompt created.");
        return;
      }

      const changed = payload.content !== active.content;
      if (changed) {
        active.versions.push({
          id: uid(),
          note: payload.note || "Content update",
          content: active.content,
          createdAt: nowIso()
        });
        active.versions = active.versions.slice(-40);
      }

      active.title = payload.title;
      active.tone = payload.tone;
      active.type = payload.type;
      active.tags = payload.tags;
      active.content = payload.content;
      active.updatedAt = nowIso();

      savePrompts();
      render();
      setStatus(changed ? "Prompt updated and version archived." : "Prompt metadata saved.");
    }

    function onCreateNew() {
      activePromptId = null;
      ui.form.reset();
      ui.toneSelect.value = "professional";
      ui.typeSelect.value = "marketing";
      ui.titleInput.focus();
      render();
      setStatus("New draft ready.");
    }

    function onCopyPrompt() {
      const payload = getFormPayload();
      if (!payload.content) {
        setStatus("Nothing to copy.");
        return;
      }

      navigator.clipboard.writeText(payload.content).then(() => {
        const active = findActive();
        if (active) {
          active.useCount += 1;
          active.updatedAt = nowIso();
          savePrompts();
          render();
        }
        setStatus("Prompt copied.");
      }).catch(() => setStatus("Clipboard failed. Try manual copy."));
    }

    function onDuplicatePrompt() {
      const active = findActive();
      if (!active) {
        setStatus("Select a prompt first.");
        return;
      }

      const clone = {
        ...active,
        id: uid(),
        title: active.title + " (copy)",
        favorite: false,
        useCount: 0,
        createdAt: nowIso(),
        updatedAt: nowIso(),
        versions: active.versions.slice(-5)
      };
      prompts.unshift(clone);
      activePromptId = clone.id;
      savePrompts();
      render();
      fillFormFromActive();
      setStatus("Prompt duplicated.");
    }

    function onToggleFavorite() {
      const active = findActive();
      if (!active) {
        setStatus("Select a prompt first.");
        return;
      }

      active.favorite = !active.favorite;
      active.updatedAt = nowIso();
      savePrompts();
      render();
      setStatus(active.favorite ? "Marked as favorite." : "Removed from favorites.");
    }

    function onDeletePrompt() {
      const active = findActive();
      if (!active) {
        setStatus("Select a prompt first.");
        return;
      }

      if (!confirm("Delete this prompt permanently?")) return;
      prompts = prompts.filter((prompt) => prompt.id !== active.id);
      activePromptId = prompts[0] ? prompts[0].id : null;
      savePrompts();
      render();
      fillFormFromActive();
      setStatus("Prompt deleted.");
    }

    function onExportJson() {
      const blob = new Blob([JSON.stringify(prompts, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "prompt-forge-export.json";
      a.click();
      URL.revokeObjectURL(url);
      setStatus("Vault exported.");
    }

    function onImportJson(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (!Array.isArray(data)) throw new Error("Invalid file.");
          const parsed = data.map(normalizePrompt).filter(Boolean);
          if (!parsed.length) throw new Error("No valid prompts found.");
          prompts = parsed;
          activePromptId = prompts[0].id;
          savePrompts();
          render();
          fillFormFromActive();
          setStatus("Import complete.");
        } catch (error) {
          setStatus("Import failed. " + error.message);
        }
      };
      reader.readAsText(file);
    }

    function fillFormFromActive() {
      const active = findActive();
      if (!active) {
        ui.form.reset();
        ui.noteInput.value = "";
        return;
      }

      ui.titleInput.value = active.title;
      ui.toneSelect.value = active.tone;
      ui.typeSelect.value = active.type;
      ui.tagsInput.value = active.tags.join(", ");
      ui.contentInput.value = active.content;
      ui.noteInput.value = "";
    }

    function findActive() {
      return prompts.find((prompt) => prompt.id === activePromptId) || null;
    }

    function getFormPayload() {
      return {
        title: ui.titleInput.value.trim(),
        tone: ui.toneSelect.value,
        type: ui.typeSelect.value,
        tags: ui.tagsInput.value.split(",").map((tag) => tag.trim().toLowerCase()).filter(Boolean),
        note: ui.noteInput.value.trim(),
        content: ui.contentInput.value.trim()
      };
    }

    function setStatus(text) {
      ui.status.textContent = text;
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function dateMs(value) {
      return new Date(value).getTime() || 0;
    }

    function formatDate(value) {
      const date = new Date(value);
      return date.toLocaleString();
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
  </script>
</body>
</html>
